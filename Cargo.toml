# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-persist"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-persist"
description = "Durable storage for Xmip runtime state."

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The identifiers a record is keyed by and the Journey state it records are
# the estate's, not this crate's: a raw UUID and a copy of the state enum were
# retired on 2026-09-14 (ADR-0044).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
journey = { package = "xmip-core-journey", git = "https://github.com/IlleNilsson/xmip-core-journey", branch = "main" }

[dev-dependencies]
# A durable record is proved by writing and reading it, not by cloning it.
serde_json = "1"
