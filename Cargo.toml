# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-persist"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-persist"
description = "Durable storage for Xmip runtime state, every record encrypted and authenticated before an engine sees it (ADR-0063)."

[lib]
# A host crate: the engines mount beside this source (ADR-0049).
path = ".src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[dependencies]
# The identifiers a record is keyed by are the estate's, not this crate's
# (ADR-0044); and the audit chain's rule, its start, each next link and its
# digest (xcore::audit_chain, ADR-0070 clause 5).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The key home: the data key a store's records are sealed under, wrapped by a
# key-encryption key of the platform's key store, and the sealing itself
# (ADR-0063). Persist says what is sealed and where; secret seals it.
secret = { package = "xmip-core-secret", git = "https://github.com/IlleNilsson/xmip-core-secret", branch = "main" }
# Who may ask the Storage plane what, decided once for every plane Xmip
# serves its own parts (`authorize::plane`): every request on the wire is
# admitted by it before it is answered (server.rs).
authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main" }
# Xmip Storage's records and its wire, read and written over the estate's
# one byte cursor and writer; SHA-1, which RFC 9562 names for a
# name-based UUID, the identifier a held Journey's queue is found by; and
# the estate's one SHA-256 (codec::digest): a Stream's bytes as they pass
# once, kept in its record, what a read of an audit record's copy is held
# to (ADR-0070), and the schema's fingerprint.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The estate's one TCP connect, bounded, Nagle off, and the most a
# connection is read for: how a node reaches a Storage node.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# Xmip's own TLS, mutual, between a node and a Storage node (ADR-0063,
# amendment 2026-10-01).
tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main" }
# The one turn every round robin of the cluster takes, the Storage nodes'
# included (`cluster::Rotation`; ADR-0056, amendment 2026-11-13): the
# cluster's pure part, without its sync plane.
xcluster = { package = "xmip-core-cluster", git = "https://github.com/IlleNilsson/xmip-core-cluster", branch = "main", default-features = false }
# SQL the language: how a script quotes a name and writes a literal, in
# each server's dialect (ADR-0044, amendment 2026-10-12). The schema's own
# types, roles and databases stay here.
sql = { package = "xmip-core-library-sql", git = "https://github.com/IlleNilsson/xmip-core-library-sql", branch = "main" }

[features]
# The engine in memory and the checks every engine runs against itself, from
# the crate's `fixture` module. An engine enables it from its dev-dependencies
# only, so neither is ever in a production build.
test-support = ["secret/test-support"]

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false
required-features = ["test-support"]

[dev-dependencies]
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
configure = { package = "xmip-core-configure", git = "https://github.com/IlleNilsson/xmip-core-configure", branch = "main", features = ["test-support"] }
# The tests seal under a key-encryption key held in memory, never the
# machine's own key store; the feature is enabled here so it is never part
# of a production build.
secret = { package = "xmip-core-secret", git = "https://github.com/IlleNilsson/xmip-core-secret", branch = "main", features = ["test-support"] }
# A certificate authority and the certificates it issues, for the tests of
# a node and a Storage node over mutual TLS. Test-only.
rcgen = "0.14"

[profile.dev.package."*"]
opt-level = 3
